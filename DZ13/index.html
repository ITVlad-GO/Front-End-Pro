<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./Css/Style.css" />
    <link rel="stylesheet" href="./Css/reset.css" />
    <title>Document</title>
  </head>
  <body>
    <form class="contact-form">
      <input class="contact-form__input" type="text" placeholder="Name" />
      <span class="contact-form__error"></span>

      <textarea class="contact-form__textarea" placeholder="Message"></textarea>
      <span class="contact-form__error"></span>

      <input
        class="contact-form__input"
        type="tel"
        placeholder="Phone number"
      />
      <span class="contact-form__error"></span>

      <input class="contact-form__input" type="email" placeholder="Email" />
      <span class="contact-form__error"></span>

      <button class="contact-form__button" type="submit">Send message</button>
    </form>
    <script src="./JS/script.js"></script>
  </body>
</html>
